<!DOCTYPE html>
<html>
<head>
<title>College Chatbot</title>

<style>
    button {
    margin: 3px;
    border-radius: 5px;
}
body {
    font-family: Arial;
    background: #e5ddd5;
}

#chatbox {
    width: 400px;
    margin: 30px auto;
    background: white;
    border-radius: 10px;
    box-shadow: 0 0 15px gray;
    overflow: hidden;
}

/* Header */
#header {
    background: #075e54;
    color: white;
    padding: 10px;
    font-size: 18px;
}

/* Messages */
#messages {
    height: 400px;
    overflow-y: auto;
    padding: 10px;
    background: #efeae2;
}

.message {
    padding: 8px;
    margin: 5px;
    border-radius: 8px;
    max-width: 70%;
}

.user {
    background: #dcf8c6;
    margin-left: auto;
    text-align: right;
}

.bot {
    background: white;
    text-align: left;
}

/* Time */
.time {
    font-size: 10px;
    color: gray;
}

/* Input */
#inputArea {
    display: flex;
    border-top: 1px solid #ccc;
}

input {
    flex: 1;
    padding: 10px;
    border: none;
}

button {
    padding: 10px;
    background: #075e54;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    background: #0b7d6d;
}

/* Clear button */
#clear {
    width: 100%;
    background: red;
}
</style>
</head>

<body>

<div id="chatbox">

<div id="header">🎓 College Admission Chatbot</div>

<div id="messages">
   
    <div class="message bot">
        Hello! I can help you with admission queries 😊
    </div>
</div>

<div id="inputArea">
    <input id="input" placeholder="Type your question...">
    <button onclick="send()">Send</button>
</div>

<button id="clear" onclick="clearChat()">Clear Chat</button>

</div>

<script>
function quick(text) {
    document.getElementById("input").value = text;
    send();
}
// Get current time
function getTime() {
    let now = new Date();
    return now.getHours() + ":" + now.getMinutes();
}

function send() {
    let msg = document.getElementById("input").value;

    if(msg.trim() === "") return;

    let time = getTime();

    // User message
    let userMsg = `<div class='message user'>${msg}<div class='time'>${time}</div></div>`;
    document.getElementById("messages").innerHTML += userMsg;

    // Typing indicator
    let typing = `<div class='message bot' id='typing'>Typing...</div>`;
    document.getElementById("messages").innerHTML += typing;

    fetch("http://127.0.0.1:5000/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: msg})
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("typing").remove();

        let botMsg = `<div class='message bot'>${data.response}<div class='time'>${time}</div></div>`;
        document.getElementById("messages").innerHTML += botMsg;
    });

    document.getElementById("input").value = "";

    // Auto scroll
    document.getElementById("messages").scrollTop =
        document.getElementById("messages").scrollHeight;
}

// Enter key
document.getElementById("input").addEventListener("keypress", function(e) {
    if(e.key === "Enter") send();
});

// Clear chat
function clearChat() {
    document.getElementById("messages").innerHTML = "";
}
</script>

</body>
</html>
